name: Update HOI4 CWT

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-hoi4-cwt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Fetch CWTools HOI4 config
        run: |
          rm -rf _tmp-cwtools-hoi4-config

          git clone --depth 1 https://github.com/cwtools/cwtools-hoi4-config.git _tmp-cwtools-hoi4-config

          rm -rf plugins/hoi4/cwt
          mkdir -p plugins/hoi4/cwt

          cp -R _tmp-cwtools-hoi4-config/Config/* plugins/hoi4/cwt/
          cp _tmp-cwtools-hoi4-config/LICENSE plugins/hoi4/cwt/LICENSE

          git -C _tmp-cwtools-hoi4-config rev-parse HEAD > plugins/hoi4/cwt/UPSTREAM_COMMIT

          rm -rf _tmp-cwtools-hoi4-config

      - name: Create pull request if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-hoi4-cwt"

          git checkout -B "$BRANCH"
          git add plugins/hoi4/cwt
          git commit -m "Update HOI4 CWT files"
          git push --force-with-lease origin "$BRANCH"

          gh pr create \
            --title "Update HOI4 CWT files" \
            --body "Updates plugins/hoi4/cwt from cwtools/cwtools-hoi4-config Config." \
            --base main \
            --head "$BRANCH" || true