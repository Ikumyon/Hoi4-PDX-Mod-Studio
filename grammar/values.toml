[value.boolean]
literals = ["yes", "no"]

[value.string]
pattern = "["^.*$"]"

[value.int]
pattern = "^-?[0-9]+$"

[value.float]
pattern = "^-?[0-9]+(\\.[0-9]+)?$"

[value.date]
pattern = "^[0-9]{4}\\.[0-9]{1,2}\\.[0-9]{1,2}$

[value.id]
pattern = "^[a-zA-Z0-9_.-]+$"

[value.country_tag]
pattern = "^[A-Z0-9]{3}$

[value.variable]
pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"

[value.enum]
source = "schema.allowed_values"

[value.block]
source = "schema.properties"