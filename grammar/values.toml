[value.boolean]
literals = ["yes", "no"]

[value.string]
pattern = "^.*$"

[value.int]
pattern = "^-?[0-9]+$"
min = -2147483648
max = 2147483647

[value.float]
pattern = "^-?[0-9]+(\\.[0-9]+)?$"
fixed_point_scale = 100000
min = -2147483648.99999
max = 2147483647.99999

[value.date]
pattern = "^[0-9]{4}\\.[0-9]{1,2}\\.[0-9]{1,2}$"

[value.id]
pattern = "^[a-zA-Z0-9_.-]+$"

[value.country_tag]
pattern = "^[A-Z0-9]{3}$"

[value.variable]
pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"

[value.expression]
pattern = "^.+$"

[value.enum]
literals_from = true

[value.block]
children = true
